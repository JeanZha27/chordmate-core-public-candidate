name: Core verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Enable declared pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          pnpm --version

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Core tests
        run: pnpm test

      - name: Run type check
        run: pnpm typecheck

      - name: Build package
        run: pnpm build
